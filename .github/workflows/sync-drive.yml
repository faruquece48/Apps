name: Sync Drive videos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: sync-drive

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-drive.mjs
      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- videos.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Sync videos from Drive"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
