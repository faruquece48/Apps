<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Swipe Videos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Video player"></main>
  <div id="gestures" aria-hidden="true"></div>

  <div id="actions">
    <button id="update" type="button" hidden>Update available</button>
    <button id="install" type="button" hidden>Install app</button>
  </div>

  <aside id="rail" hidden>
    <button id="like" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 10v11H3V10zm0 0 4-8c1.7 0 3 1.3 3 3v3h5.5c1.4 0 2.4 1.3 2.1 2.6l-1.8 8c-.2.8-1 1.4-1.9 1.4H7"/></svg>
      <span>Like</span>
    </button>
    <button id="save" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      <span>Save</span>
    </button>
    <button id="share" type="button">
      <svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4c-5 0-8 1.5-11 5 1-6 4-10 11-11z"/></svg>
      <span>Share</span>
    </button>
    <button id="sound" type="button" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span id="sound-label">Mute</span>
    </button>
  </aside>

  <div id="info" hidden>
    <div id="channel" hidden>
      <img src="icon-192.png" alt="">
      <strong id="channel-name"></strong>
      <span id="position"></span>
    </div>
    <h1 id="title"></h1>
  </div>

  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" hidden>

  <nav id="tabs" aria-label="Main">
    <button id="tab-home" type="button" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
      <span>Home</span>
    </button>
    <button id="tab-saved" type="button">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      <span>Saved</span>
    </button>
  </nav>

  <div id="message" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
