<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Swipe Videos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Video player"></main>
  <div id="gestures" aria-hidden="true"></div>
  <div id="info" hidden>
    <h1 id="title"></h1>
    <span id="position"></span>
  </div>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" hidden>
  <button id="sound" type="button" hidden>Tap for sound</button>
  <div id="actions">
    <button id="update" type="button" hidden>Update available</button>
    <button id="install" type="button" hidden>Install app</button>
  </div>
  <div id="message" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
